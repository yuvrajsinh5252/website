<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Yuvrajsinh Gohil">
  <!--
    The sun mark, drawn as fills only so it needs no stroke colour resolving.

    There is deliberately no backdrop: the mark is a silhouette and a plate
    behind it only shows up as a square on a rounded tab strip. Without one it
    would disappear against a light strip, so the ink follows the browser's
    colour scheme instead of being pinned to one value.
  -->
  <style>
    .ink { fill: #111827; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #f3f4f6; }
    }
  </style>

  <g class="ink">
    <!-- The disc: bold, solid, and easily readable at 16px. -->
    <circle cx="16" cy="16" r="9.1" />

    <!-- Four heavy cardinal rays, as capsules. -->
    <rect x="13.85" y="0.2" width="4.3" height="6.1" rx="2.15" />
    <rect x="13.85" y="0.2" width="4.3" height="6.1" rx="2.15" transform="rotate(90 16 16)" />
    <rect x="13.85" y="0.2" width="4.3" height="6.1" rx="2.15" transform="rotate(180 16 16)" />
    <rect x="13.85" y="0.2" width="4.3" height="6.1" rx="2.15" transform="rotate(270 16 16)" />

    <!-- Four diagonal orbs between them. -->
    <circle cx="16" cy="3.6" r="2.1" transform="rotate(45 16 16)" />
    <circle cx="16" cy="3.6" r="2.1" transform="rotate(135 16 16)" />
    <circle cx="16" cy="3.6" r="2.1" transform="rotate(225 16 16)" />
    <circle cx="16" cy="3.6" r="2.1" transform="rotate(315 16 16)" />
  </g>
</svg>
