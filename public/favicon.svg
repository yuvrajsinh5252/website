<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Yuvrajsinh Gohil">
  <!--
    The sun mark, drawn as fills only so it needs no stroke colour resolving.

    There is deliberately no backdrop: the mark is a silhouette and a plate
    behind it only shows up as a square on a rounded tab strip. Without one it
    would disappear against a light strip, so the ink follows the browser's
    colour scheme instead of being pinned to one value.
  -->
  <style>
    .ink { fill: #10151f; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #dbe4f2; }
    }
  </style>

  <g class="ink">
    <!-- The disc: the largest single mass, so the mark still reads at 16px. -->
    <circle cx="16" cy="16" r="7.6" />

    <!-- Four heavy rays on the cardinals, as capsules. -->
    <rect x="14.25" y="0.85" width="3.5" height="6.1" rx="1.75" />
    <rect x="14.25" y="0.85" width="3.5" height="6.1" rx="1.75" transform="rotate(90 16 16)" />
    <rect x="14.25" y="0.85" width="3.5" height="6.1" rx="1.75" transform="rotate(180 16 16)" />
    <rect x="14.25" y="0.85" width="3.5" height="6.1" rx="1.75" transform="rotate(270 16 16)" />

    <!-- Four orbs between them, which is what makes it this sun. -->
    <circle cx="16" cy="4.4" r="1.85" transform="rotate(45 16 16)" />
    <circle cx="16" cy="4.4" r="1.85" transform="rotate(135 16 16)" />
    <circle cx="16" cy="4.4" r="1.85" transform="rotate(225 16 16)" />
    <circle cx="16" cy="4.4" r="1.85" transform="rotate(315 16 16)" />
  </g>
</svg>
