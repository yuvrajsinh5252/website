<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Yuvrajsinh Gohil">
  <!--
    Apoapsis YG — Brand Favicon
    The monogram "Y" with an elliptical orbit and tracking "G" (Gohil).
    Enlarged scale and bolder strokes for crisp browser tab clarity.
  -->
  <style>
    .orbit { stroke: #64748b; }
    .glyph { stroke: #0f172a; }
    .satellite { stroke: #0284c7; fill: none; }
    @media (prefers-color-scheme: dark) {
      .orbit { stroke: #cbd5e1; }
      .glyph { stroke: #ffffff; }
      .satellite { stroke: #38bdf8; fill: none; }
    }
  </style>

  <!-- Elliptical Orbit Path -->
  <ellipse
    cx="16"
    cy="16"
    rx="14"
    ry="7.2"
    class="orbit"
    stroke-width="1.6"
    stroke-dasharray="0 3.6"
    stroke-linecap="round"
    opacity="0.65"
    fill="none"
    transform="rotate(-24 16 16)"
  />

  <!-- Central Monogram "Y" (Enlarged & Bolder) -->
  <path
    d="M8.5 7.5 16 16m7.5-8.5L16 16m0 0v11"
    class="glyph"
    stroke-width="3.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Satellite Monogram "G" (Gohil) on the Orbit -->
  <path
    d="M 30.5 8.2 A 3.2 3.2 0 1 0 31.0 12.0 H 28.0"
    class="satellite"
    stroke-width="2.0"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
