<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Yuvrajsinh Gohil">
  <!--
    Apoapsis — Brand Favicon
    The monogram "Y" with an elliptical orbit and tracking satellite.
    Enlarged scale and bolder strokes for crisp browser tab clarity.
  -->
  <style>
    .orbit { stroke: #64748b; }
    .glyph { stroke: #0f172a; }
    .satellite { fill: #0f172a; }
    @media (prefers-color-scheme: dark) {
      .orbit { stroke: #cbd5e1; }
      .glyph { stroke: #ffffff; }
      .satellite { fill: #ffffff; }
    }
  </style>

  <!-- Elliptical Orbit Path -->
  <ellipse
    cx="16"
    cy="16"
    rx="14"
    ry="7.2"
    class="orbit"
    stroke-width="1.6"
    opacity="0.6"
    fill="none"
    transform="rotate(-24 16 16)"
  />

  <!-- Central Monogram "Y" (Enlarged & Bolder) -->
  <path
    d="M8.5 7.5 16 16m7.5-8.5L16 16m0 0v11"
    class="glyph"
    stroke-width="3.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Tracking Satellite Orb -->
  <circle cx="28.8" cy="10.3" r="2.9" class="satellite" />
</svg>
